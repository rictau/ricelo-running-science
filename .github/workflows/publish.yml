name: Publish to PyPI

# Runs when a GitHub release is published. Uses PyPI trusted publishing,
# so no API token is stored: PyPI must list this repository, this workflow
# (publish.yml) and the `pypi` environment as a trusted publisher.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Check the release tag matches the package version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish
